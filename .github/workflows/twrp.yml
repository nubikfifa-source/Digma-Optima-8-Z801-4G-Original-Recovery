name: Build Real TWRP Recovery (Digma Z801 4G - Rev 1)

on:
  workflow_dispatch:

jobs:
  build_twrp:
    name: Compile TWRP from Source via twrpdtgen
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Maximize Disk Space for Android Build
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: 3. Install Build Dependencies & twrpdtgen
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3-pip cpio lzma xz-utils
          pip3 install twrpdtgen
          mkdir -p ~/bin
          for i in 1 2 3; do
            git clone --depth=1 https://github.com ~/git-repo-tmp && break || sleep 5
          done
          cp ~/git-repo-tmp/repo ~/bin/repo
          rm -rf ~/git-repo-tmp
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: 4. Fetch Stock recovery.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/stock
          gh release download 1.0 --repo "nubikfifa-source/Digma-Optima-8-Z801-4G-Original-Recovery" --pattern "recovery.img" --dir ~/stock || true
          if [ ! -f ~/stock/recovery.img ]; then
            if [ -f recovery.img ]; then
              cp recovery.img ~/stock/recovery.img
            else
              echo "ERROR: recovery.img not found in release 1.0 or repo root!"
              exit 1
            fi
          fi

      - name: 5. Generate Device Tree with twrpdtgen
        run: |
          cd ~/stock
          python3 -m twrpdtgen recovery.img -o ~/device_tree
          echo "Generated tree structure:"
          ls -la ~/device_tree/*/*

      - name: 6. Initialize Minimal TWRP 10.0 Manifest
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          git config --global user.name "Builder"
          git config --global user.email "builder@github.com"
          git config --global color.ui false
          ~/bin/repo init --depth=1 --no-repo-verify --repo-url=https://github.com --repo-rev=main -u https://github.com -b twrp-10.0
          ~/bin/repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: 7. Copy Device Tree & Apply LZMA Compression
        run: |
          VENDOR=$(ls ~/device_tree | head -n 1)
          DEVICE=$(ls ~/device_tree/$VENDOR | head -n 1)
          mkdir -p ~/twrp/device/$VENDOR/$DEVICE
          cp -r ~/device_tree/$VENDOR/$DEVICE/* ~/twrp/device/$VENDOR/$DEVICE/

          BOARD_CFG=~/twrp/device/$VENDOR/$DEVICE/BoardConfig.mk
          cat << 'EOF' >> "$BOARD_CFG"

          # Size optimization for Digma Z801 4G (Unisoc SC9863A)
          BOARD_RAMDISK_USE_LZMA := true
          TW_EXTRA_LANGUAGES := false
          TW_EXCLUDE_DEFAULT_USB_INIT := true
          TW_NO_SCREEN_BLANK := true
          TW_BRIGHTNESS_PATH := "/sys/class/backlight/sprd_backlight/brightness"
          TW_MAX_BRIGHTNESS := 255
          TW_DEFAULT_BRIGHTNESS := 120
          EOF

          echo "VENDOR=$VENDOR" >> $GITHUB_ENV
          echo "DEVICE=$DEVICE" >> $GITHUB_ENV

      - name: 8. Compile TWRP Recovery Image
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_${DEVICE}-eng
          mka recoveryimage -j$(nproc --all)
          mkdir -p $GITHUB_WORKSPACE/out_twrp
          cp out/target/product/${DEVICE}/recovery.img $GITHUB_WORKSPACE/out_twrp/recovery.img

      - name: 9. Upload Compiled TWRP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP_Real_Digma_Z801_4G_Rev1
          path: out_twrp/recovery.img
