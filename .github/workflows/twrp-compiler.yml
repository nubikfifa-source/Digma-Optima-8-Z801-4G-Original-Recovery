name: TWRP Recovery Builder for Digma Z801

on:
  workflow_dispatch:

env:
  RECOVERY_URL: "https://github.com"
  DEVICE_NAME: "Z801"
  DEVICE_BRAND: "Digma"

jobs:
  twrp_build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update --fix-missing
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip python3-setuptools
        sudo pip3 install twrpdtgen

    - name: Generate Device Tree from Stock Recovery
      run: |
        mkdir input_files
        curl -sL "${{ env.RECOVERY_URL }}" -o input_files/recovery.img
        mkdir device_tree
        python3 -m twrpdtgen input_files/recovery.img -o device_tree/

    - name: Prepare Omni ROM Source Environment
      run: |
        mkdir twrp_sources
        cd twrp_sources
        git config --global user.name "nubikfifa-source"
        git config --global user.email "nubikfifa-source@github.com"
        repo init --depth=1 -u https://github.com -b twrp-9.0
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Copy Generated Device Tree to Build Folder
      run: |
        cp -r device_tree/${{ env.DEVICE_BRAND }}/${{ env.DEVICE_NAME }} twrp_sources/device/${{ env.DEVICE_BRAND }}/${{ env.DEVICE_NAME }}

    - name: Compile TWRP Recovery Image
      run: |
        cd twrp_sources
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch omni_${{ env.DEVICE_NAME }}-eng
        make recoveryimage -j$(nproc --all)

    - name: Upload Compiled TWRP Recovery as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_Recovery_${{ env.DEVICE_NAME }}
        path: twrp_sources/out/target/product/${{ env.DEVICE_NAME }}/recovery.img
