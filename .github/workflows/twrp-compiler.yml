name: TWRP Recovery Builder for Digma Z801

on:
  workflow_dispatch:

env:
  RECOVERY_URL: "https://github.com"
  DEVICE_NAME: "Z801"
  DEVICE_BRAND: "Digma"

jobs:
  twrp_build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --user root
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Timezone and Install Core Tools
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y tzdata curl git python3 python3-pip python3-setuptools zip unzip rsync cpio lzma
        pip3 install twrpdtgen

    - name: Generate Device Tree from Stock Recovery
      run: |
        mkdir input_files
        curl -sL "${{ env.RECOVERY_URL }}" -o input_files/recovery.img
        mkdir device_tree
        python3 -m twrpdtgen input_files/recovery.img -o device_tree/

    - name: Install Android Build Tools and Fix Old Libraries
      run: |
        export DEBIAN_FRONTEND=noninteractive
        # Добавляем репозиторий старой Убунту, чтобы выкачать недостающие 32-битные библиотеки для Android
        echo "deb http://ubuntu.com focal-security main" | tee /etc/apt/sources.list.d/focal-security.list
        apt-get update
        apt-get install -y libncurses5 libssl1.1 || true
        apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush schedtool squashfs-tools xsltproc zlib1g-dev

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "PATH=$HOME/bin:$PATH" >> $GITHUB_ENV

    - name: Prepare Omni ROM Source Environment
      run: |
        export PATH=$HOME/bin:$PATH
        mkdir twrp_sources
        cd twrp_sources
        git config --global user.name "nubikfifa-source"
        git config --global user.email "nubikfifa-source@github.com"
        # Используем современный синтаксис для инициализации репозитория исходников
        repo init --depth=1 -u https://github.com -b twrp-9.0 --repo-rev=v2.45
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Copy Generated Device Tree to Build Folder
      run: |
        cp -r device_tree/${{ env.DEVICE_BRAND }}/${{ env.DEVICE_NAME }} twrp_sources/device/${{ env.DEVICE_BRAND }}/${{ env.DEVICE_NAME }}

    - name: Compile TWRP Recovery Image
      run: |
        cd twrp_sources
        export ALLOW_MISSING_DEPENDENCIES=true
        /bin/bash -c "source build/envsetup.sh && lunch omni_${{ env.DEVICE_NAME }}-eng && make recoveryimage -j$(nproc --all)"

    - name: Upload Compiled TWRP Recovery as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_Recovery_${{ env.DEVICE_NAME }}
        path: twrp_sources/out/target/product/${{ env.DEVICE_NAME }}/recovery.img
