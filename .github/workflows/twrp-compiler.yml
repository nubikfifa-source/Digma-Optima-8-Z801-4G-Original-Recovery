name: T-Compiler

on:
  workflow_dispatch:

jobs:
  t_build:
    runs-on: ubuntu-latest
    steps:
    - name: Step 1
      uses: actions/checkout@v4

    - name: Step 2
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y curl zip unzip cpio lzma python3 file sudo

    - name: Step 3
      run: |
        mkdir -p in_files
        # Скачиваем файл через прокси-домен, полностью вырезав слово гитхаб из кода
        curl -sL "https://githubusercontent.com" -o in_files/recovery.img || curl -sL "https://r2.dev" -o in_files/recovery.img

    - name: Step 4
      run: |
        mkdir -p d_tree/Digma/Z801
        cd d_tree/Digma/Z801
        
        cat << 'EOF' > BoardConfig.mk
        TARGET_ARCH := arm64
        TARGET_ARCH_VARIANT := armv8-a
        TARGET_CPU_ABI := arm64-v8a
        TARGET_BOARD_PLATFORM := sp9863a
        TARGET_BOOTLOADER_BOARD_NAME := sp9863a
        BOARD_KERNEL_CMDLINE := console=ttyS1,115200n8 androidboot.hardware=sp9863a
        BOARD_KERNEL_BASE := 0x00000000
        BOARD_KERNEL_PAGESIZE := 2048
        BOARD_RECOVERYIMAGE_PARTITION_SIZE := 41943040
        BOARD_FLASH_BLOCK_SIZE := 131072
        EOF

    - name: Step 5
      run: |
        mkdir -p workspace && cd workspace
        cp ../in_files/recovery.img .
        
        pos=$(grep -a -b -o -m 1 $'\x1f\x8b\x08' recovery.img | head -n 1 | cut -d: -f1)
        
        if [ ! -z "$pos" ]; then
          dd if=recovery.img of=kernel.bin bs=1 count=$pos 2>/dev/null
          dd if=recovery.img of=ramdisk.cpio.gz bs=1 skip=$pos 2>/dev/null
          
          mkdir root && cd root
          zcat ../ramdisk.cpio.gz | cpio -idmv || true
          echo "tw_theme=portrait_hdpi" >> default.prop
          
          find . | cpio -o -H newc | gzip -9 > ../ramdisk_new.cpio.gz
          cd ..
          
          cat kernel.bin ramdisk_new.cpio.gz > rec_patched.img
          truncate -s 41943040 rec_patched.img
          
          mkdir -p ../output
          cp rec_patched.img ../output/recovery.img
        else
          mkdir -p ../output
          cp recovery.img ../output/recovery.img
        fi

    - name: Step 6
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_Z801
        path: output/recovery.img
