name: TWRP Recovery Builder for Digma Z801

on:
  workflow_dispatch:

env:
  RECOVERY_URL: "https://github.com"
  DEVICE_NAME: "Z801"
  DEVICE_BRAND: "Digma"

jobs:
  twrp_build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Stock Recovery
      run: |
        mkdir -p input_files
        curl -sL "${{ env.RECOVERY_URL }}" -o input_files/recovery.img

    - name: Create Custom Device Tree Manually
      run: |
        mkdir -p device_tree/${{ env.DEVICE_BRAND }}/${{ env.DEVICE_NAME }}
        cd device_tree/${{ env.DEVICE_BRAND }}/${{ env.DEVICE_NAME }}
        
        cat <<EOF > AndroidProducts.mk
        PRODUCT_MAKEFILES := \$(LOCAL_DIR)/omni_${{ env.DEVICE_NAME }}.mk
        EOF
        
        cat <<EOF > BoardConfig.mk
        LOCAL_PATH := device/${{ env.DEVICE_BRAND }}/${{ env.DEVICE_NAME }}
        
        # Architecture
        TARGET_ARCH := arm64
        TARGET_ARCH_VARIANT := armv8-a
        TARGET_CPU_ABI := arm64-v8a
        TARGET_CPU_ABI2 := 
        TARGET_CPU_VARIANT := generic
        
        TARGET_2ND_ARCH := arm
        TARGET_2ND_ARCH_VARIANT := armv7-a-neon
        TARGET_2ND_CPU_ABI := armeabi-v7a
        TARGET_2ND_CPU_ABI2 := armeabi
        TARGET_2ND_CPU_VARIANT := generic
        
        # Platform
        TARGET_BOARD_PLATFORM := sc9863a
        TARGET_BOOTLOADER_BOARD_NAME := sc9863a
        
        # Kernel parameters
        BOARD_KERNEL_CMDLINE := console=ttyS1,115200n8 androidboot.hardware=sc9863a printk.disable_uart=1
        BOARD_KERNEL_BASE := 0x00000000
        BOARD_KERNEL_PAGESIZE := 2048
        
        # Flash / Partitions info
        BOARD_RECOVERYIMAGE_PARTITION_SIZE := 41943040
        BOARD_FLASH_BLOCK_SIZE := 131072
        
        # TWRP Configuration Flags
        TW_THEME := portrait_hdpi
        RECOVERY_SDCARD_ON_DATA := true
        TARGET_USERIMAGES_USE_EXT4 := true
        TW_EXCLUDE_DEFAULT_USB_INIT := true
        TW_INCLUDE_CRYPTO := false
        ALLOW_MISSING_DEPENDENCIES := true
        EOF
        
        cat <<EOF > omni_${{ env.DEVICE_NAME }}.mk
        \$(call inherit-product, \$(SRC_TARGET_DIR)/product/core_64_bit.mk)
        \$(call inherit-product, \$(SRC_TARGET_DIR)/product/embedded.mk)
        
        PRODUCT_DEVICE := ${{ env.DEVICE_NAME }}
        PRODUCT_NAME := omni_${{ env.DEVICE_NAME }}
        PRODUCT_BRAND := ${{ env.DEVICE_BRAND }}
        PRODUCT_MODEL := ${{ env.DEVICE_NAME }}
        PRODUCT_MANUFACTURER := ${{ env.DEVICE_BRAND }}
        EOF
        
        cat <<EOF > Android.mk
        LOCAL_PATH := \$(call my-dir)
        ifeq (\$(TARGET_DEVICE),${{ env.DEVICE_NAME }})
        include \$(call all-makefiles-under,\$(LOCAL_PATH))
        endif
        EOF

    - name: Package Device Tree into ZIP Archive
      run: |
        cd device_tree
        zip -r ../Z801_Device_Tree.zip ./*

    - name: Upload Generated Device Tree as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Z801_TWRP_Device_Tree
        path: Z801_Device_Tree.zip
