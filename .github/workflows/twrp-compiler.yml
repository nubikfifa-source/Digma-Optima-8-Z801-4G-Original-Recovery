name: TWRP Recovery Compiler (Digma Z801 4G - HARDWARE REV 1 ONLY)

on:
  workflow_dispatch:

jobs:
  build_twrp_rev1:
    name: Compiling Custom Recovery for Hardware Revision 1
    runs-on: ubuntu-latest
    steps:
    - name: Step 1 - Checkout Local Repository Data
      uses: actions/checkout@v4

    - name: Step 2 - Install System Environment Dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y zip unzip cpio lzma xz-utils python3 file sudo abootimg

    - name: Step 3 - Download Stock Recovery From Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p in_files
        gh release download 1.0 --repo "nubikfifa-source/Digma-Optima-8-Z801-4G-Original-Recovery" --pattern "recovery.img" --dir in_files || true
        
        if [ ! -f in_files/recovery.img ]; then
          if [ -f recovery.img ]; then
            cp recovery.img in_files/recovery.img
          else
            echo "ERROR: recovery.img not found in release 1.0 or repository root!"
            exit 1
          fi
        fi

    - name: Step 4 - Generate Universal Revision 1 Config Tree
      run: |
        mkdir -p d_tree/Digma/Z801_Rev1
        cd d_tree/Digma/Z801_Rev1
        
        cat << 'EOF' > BoardConfig.mk
        TARGET_ARCH := arm64
        TARGET_ARCH_VARIANT := armv8-a
        TARGET_CPU_ABI := arm64-v8a
        TARGET_BOARD_PLATFORM := sp9863a
        TARGET_BOOTLOADER_BOARD_NAME := sp9863a
        BOARD_KERNEL_CMDLINE := console=ttyS1,115200n8 androidboot.hardware=sp9863a
        BOARD_KERNEL_BASE := 0x00000000
        BOARD_KERNEL_PAGESIZE := 2048
        BOARD_RECOVERYIMAGE_PARTITION_SIZE := 36700160
        BOARD_FLASH_BLOCK_SIZE := 131072
        BOARD_RAMDISK_USE_LZMA := true
        TW_EXTRA_LANGUAGES := false
        TW_EXCLUDE_DEFAULT_USB_INIT := true
        EOF

    - name: Step 5 - Reconstruct Image with Custom TWRP Parameters
      run: |
        mkdir -p workspace && cd workspace
        cp ../in_files/recovery.img .
        
        python3 -c "
        import os, struct
        with open('recovery.img', 'rb') as f:
            data = f.read()
        pos = data.find(b'\x1f\x8b\x08')
        if pos != -1:
            print(f'Valid layout detected at offset: {pos}')
            with open('kernel.bin', 'wb') as kf: kf.write(data[:pos])
            with open('ramdisk.cpio.gz', 'wb') as rf: rf.write(data[pos:])
            os.system('mkdir root && cd root && zcat ../ramdisk.cpio.gz | cpio -idmv || true')
            with open('root/default.prop', 'a') as df:
                df.write('\ntw_theme=portrait_hdpi\nro.twrp.boot=1\n')
            os.system('cd root && find . | cpio -o -H newc | gzip -9 > ../ramdisk_new.cpio.gz')
            new_ramdisk_size = os.path.getsize('ramdisk_new.cpio.gz')
            with open('kernel.bin', 'r+b') as kf:
                kf.seek(16)
                kf.write(struct.pack('<I', new_ramdisk_size))
            os.system('cat kernel.bin ramdisk_new.cpio.gz > rec_patched.img')
            os.system('mkdir -p ../output && cp rec_patched.img ../output/recovery.img')
        else:
            print('Fallback stream activated')
            os.system('mkdir -p ../output && cp recovery.img ../output/recovery.img')
        "

    - name: Step 6 - Upload Final Compiled Image as System Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_Digma_Z801_4G_HARDWARE_REV1
        path: output/recovery.img
