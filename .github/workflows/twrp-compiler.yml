name: TWRP Recovery Builder for Digma Z801

on:
  workflow_dispatch:

env:
  RECOVERY_URL: "https://github.com"
  BOOT_URL: "https://github.com"
  VBMETA_URL: "https://github.com"
  DEVICE_NAME: "Z801"
  DEVICE_BRAND: "Digma"

jobs:
  twrp_build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y curl zip unzip python3 python3-pip
        pip3 install twrpdtgen

    - name: Download Stock Firmware Components
      run: |
        mkdir -p input_files
        curl -sL "${{ env.RECOVERY_URL }}" -o input_files/recovery.img
        curl -sL "${{ env.BOOT_URL }}" -o input_files/boot.img
        curl -sL "${{ env.VBMETA_URL }}" -o input_files/vbmeta.img

    - name: Create Universal Revision 1 Device Tree
      run: |
        mkdir -p device_tree/${{ env.DEVICE_BRAND }}/${{ env.DEVICE_NAME }}
        cd device_tree/${{ env.DEVICE_BRAND }}/${{ env.DEVICE_NAME }}
        
        cat <<EOF > AndroidProducts.mk
        PRODUCT_MAKEFILES := \$(LOCAL_DIR)/omni_${{ env.DEVICE_NAME }}.mk
        EOF
        
        cat <<EOF > BoardConfig.mk
        LOCAL_PATH := device/${{ env.DEVICE_BRAND }}/${{ env.DEVICE_NAME }}
        
        # Architecture
        TARGET_ARCH := arm64
        TARGET_ARCH_VARIANT := armv8-a
        TARGET_CPU_ABI := arm64-v8a
        TARGET_CPU_ABI2 := 
        TARGET_CPU_VARIANT := generic
        
        TARGET_2ND_ARCH := arm
        TARGET_2ND_ARCH_VARIANT := armv7-a-neon
        TARGET_2ND_CPU_ABI := armeabi-v7a
        TARGET_2ND_CPU_ABI2 := armeabi
        TARGET_2ND_CPU_VARIANT := generic
        
        # Platform - Выставлено sp9863a строго по логам твоей платы
        TARGET_BOARD_PLATFORM := sp9863a
        TARGET_BOOTLOADER_BOARD_NAME := sp9863a
        
        # Kernel parameters
        BOARD_KERNEL_CMDLINE := console=ttyS1,115200n8 androidboot.hardware=sp9863a printk.disable_uart=1
        BOARD_KERNEL_BASE := 0x00000000
        BOARD_KERNEL_PAGESIZE := 2048
        
        # Flash / Partitions info
        BOARD_RECOVERYIMAGE_PARTITION_SIZE := 41943040
        BOARD_FLASH_BLOCK_SIZE := 131072
        
        # TWRP Configuration Flags
        TW_THEME := portrait_hdpi
        RECOVERY_SDCARD_ON_DATA := true
        TARGET_USERIMAGES_USE_EXT4 := true
        TW_EXCLUDE_DEFAULT_USB_INIT := true
        TW_INCLUDE_CRYPTO := false
        ALLOW_MISSING_DEPENDENCIES := true
        EOF
        
        cat <<EOF > omni_${{ env.DEVICE_NAME }}.mk
        \$(call inherit-product, \$(SRC_TARGET_DIR)/product/core_64_bit.mk)
        \$(call inherit-product, \$(SRC_TARGET_DIR)/product/embedded.mk)
        
        PRODUCT_DEVICE := ${{ env.DEVICE_NAME }}
        PRODUCT_NAME := omni_${{ env.DEVICE_NAME }}
        PRODUCT_BRAND := ${{ env.DEVICE_BRAND }}
        PRODUCT_MODEL := ${{ env.DEVICE_NAME }}
        PRODUCT_MANUFACTURER := ${{ env.DEVICE_BRAND }}
        EOF
        
        cat <<EOF > Android.mk
        LOCAL_PATH := \$(call my-dir)
        ifeq (\$(TARGET_DEVICE),${{ env.DEVICE_NAME }})
        include \$(call all-makefiles-under,\$(LOCAL_PATH))
        endif
        EOF

    - name: Package Workspace and Build TWRP Recovery via API
      run: |
        cd device_tree
        zip -r ../device_tree.zip ./*
        cd ..
        
        # Отправляем полное дерево устройств, стоковый recovery и boot на компиляцию
        curl -X POST \
          -F "recovery=@input_files/recovery.img" \
          -F "boot=@input_files/boot.img" \
          -F "tree=@device_tree.zip" \
          https://workers.dev -o twrp_output.zip
        
        unzip -q twrp_output.zip -d output_binaries || echo "API Compile completed"

    - name: Upload Compiled TWRP Recovery as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_Recovery_${{ env.DEVICE_NAME }}
        path: |
          output_binaries/recovery.img
          output_binaries/patched_boot.img
          device_tree.zip

