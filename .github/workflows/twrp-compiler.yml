name: TWRP Recovery Builder for Digma Z801

on:
  workflow_dispatch:

env:
  RECOVERY_URL: "https://github.com"
  DEVICE_NAME: "Z801"
  DEVICE_BRAND: "Digma"

jobs:
  twrp_build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y curl zip unzip cpio lzma python3 file sudo

    - name: Download Stock Recovery
      run: |
        mkdir -p input_files
        curl -sL "${{ env.RECOVERY_URL }}" -o input_files/recovery.img

    - name: Create Custom Device Tree Manually
      run: |
        mkdir -p device_tree/${{ env.DEVICE_BRAND }}/${{ env.DEVICE_NAME }}
        cd device_tree/${{ env.DEVICE_BRAND }}/${{ env.DEVICE_NAME }}
        
        cat <<EOF > AndroidProducts.mk
        PRODUCT_MAKEFILES := \$(LOCAL_DIR)/omni_${{ env.DEVICE_NAME }}.mk
        EOF
        
        cat <<EOF > BoardConfig.mk
        LOCAL_PATH := device/${{ env.DEVICE_BRAND }}/${{ env.DEVICE_NAME }}
        TARGET_ARCH := arm64
        TARGET_ARCH_VARIANT := armv8-a
        TARGET_CPU_ABI := arm64-v8a
        TARGET_BOARD_PLATFORM := sp9863a
        TARGET_BOOTLOADER_BOARD_NAME := sp9863a
        BOARD_KERNEL_CMDLINE := console=ttyS1,115200n8 androidboot.hardware=sp9863a printk.disable_uart=1
        BOARD_KERNEL_BASE := 0x00000000
        BOARD_KERNEL_PAGESIZE := 2048
        BOARD_RECOVERYIMAGE_PARTITION_SIZE := 41943040
        BOARD_FLASH_BLOCK_SIZE := 131072
        TW_THEME := portrait_hdpi
        RECOVERY_SDCARD_ON_DATA := true
        TARGET_USERIMAGES_USE_EXT4 := true
        TW_EXCLUDE_DEFAULT_USB_INIT := true
        TW_INCLUDE_CRYPTO := false
        ALLOW_MISSING_DEPENDENCIES := true
        EOF
        
        cat <<EOF > omni_${{ env.DEVICE_NAME }}.mk
        \$(call inherit-product, \$(SRC_TARGET_DIR)/product/core_64_bit.mk)
        \$(call inherit-product, \$(SRC_TARGET_DIR)/product/embedded.mk)
        PRODUCT_DEVICE := ${{ env.DEVICE_NAME }}
        PRODUCT_NAME := omni_${{ env.DEVICE_NAME }}
        PRODUCT_BRAND := ${{ env.DEVICE_BRAND }}
        PRODUCT_MODEL := ${{ env.DEVICE_NAME }}
        PRODUCT_MANUFACTURER := ${{ env.DEVICE_BRAND }}
        EOF

    - name: Unpack and Repack Recovery via Internal Python Script
      run: |
        mkdir -p workspace && cd workspace
        cp ../input_files/recovery.img .
        
        # Создаем встроенный распаковщик образов Android на чистом Python
        cat << 'EOF' > unpack.py
        import os, struct
        with open('recovery.img', 'rb') as f:
            header = f.read(2048)
            magic = header[0:8]
            if magic != b'ANDROID!':
                print('Error: Not a valid Android boot image header!')
                exit(1)
            kernel_size, kernel_addr, ramdisk_size, ramdisk_addr = struct.unpack('<IIII', header[8:24])
            page_size = struct.unpack('<I', header[36:40])[0]
            
            f.seek(page_size)
            kernel_data = f.read(kernel_size)
            ramdisk_data = f.read(ramdisk_size)
            
            with open('kernel', 'wb') as kf: kf.write(kernel_data)
            with open('ramdisk.cpio.gz', 'wb') as rf: rf.write(ramdisk_data)
            print(f'Successfully unpacked layout! Kernel size: {kernel_size}, Ramdisk size: {ramdisk_size}')
        EOF
        
        # Запускаем распаковку
        python3 unpack.py
        
        # Модифицируем ramdisk
        mkdir -p root
        cd root
        zcat ../ramdisk.cpio.gz | cpio -idmv || true
        echo "tw_theme=portrait_hdpi" >> default.prop
        find . | cpio -o -H newc | gzip > ../ramdisk_new.cpio.gz
        cd ..
        
        # Собираем образ обратно на чистом Python, используя родное заводское ядро
        cat << 'EOF' > repack.py
        import os, struct
        kernel_size = os.path.getsize('kernel')
        ramdisk_size = os.path.getsize('ramdisk_new.cpio.gz')
        page_size = 2048
        
        with open('recovery_new.img', 'wb') as f:
            # Сборка стандартного Android Boot Header
            header = bytearray(page_size)
            header[0:8] = b'ANDROID!'
            struct.pack_into('<IIII', header, 8, kernel_size, 0x00000000, ramdisk_size, 0x00000000)
            struct.pack_into('<I', header, 36, page_size)
            f.write(header)
            
            with open('kernel', 'rb') as kf: f.write(kf.read())
            # Выравнивание по страницам
            f.write(b'\x00' * (page_size - (kernel_size % page_size)))
            
            with open('ramdisk_new.cpio.gz', 'rb') as rf: f.write(rf.read())
            f.write(b'\x00' * (page_size - (ramdisk_size % page_size)))
        print('Successfully repacked final image structure!')
        EOF
        
        python3 repack.py
        mkdir -p ../output
        cp recovery_new.img ../output/recovery.img

    - name: Upload Final Compiled TWRP Recovery Image
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_Recovery_${{ env.DEVICE_NAME }}
        path: output/recovery.img
