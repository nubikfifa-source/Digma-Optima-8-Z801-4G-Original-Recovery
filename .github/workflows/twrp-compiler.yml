name: TWRP Recovery Builder for Digma Z801

on:
  workflow_dispatch:

env:
  RECOVERY_URL: "https://github.com"
  DEVICE_NAME: "Z801"
  DEVICE_BRAND: "Digma"

jobs:
  twrp_build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Timezone and Install Core Tools
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y tzdata curl git python3 python3-pip python3-setuptools zip unzip rsync cpio lzma python-is-python3 file sudo
        
        # Скачиваем официальную автономную утилиту repo напрямую от Google
        sudo curl https://googleapis.com -o /usr/local/bin/repo
        sudo chmod a+x /usr/local/bin/repo

    - name: Download Stock Recovery
      run: |
        mkdir -p input_files
        curl -sL "${{ env.RECOVERY_URL }}" -o input_files/recovery.img

    - name: Create Custom Device Tree Manually
      run: |
        mkdir -p device_tree/${{ env.DEVICE_BRAND }}/${{ env.DEVICE_NAME }}
        cd device_tree/${{ env.DEVICE_BRAND }}/${{ env.DEVICE_NAME }}
        
        cat <<EOF > AndroidProducts.mk
        PRODUCT_MAKEFILES := \$(LOCAL_DIR)/omni_${{ env.DEVICE_NAME }}.mk
        EOF
        
        cat <<EOF > BoardConfig.mk
        LOCAL_PATH := device/${{ env.DEVICE_BRAND }}/${{ env.DEVICE_NAME }}
        
        # Architecture
        TARGET_ARCH := arm64
        TARGET_ARCH_VARIANT := armv8-a
        TARGET_CPU_ABI := arm64-v8a
        TARGET_CPU_ABI2 := 
        TARGET_CPU_VARIANT := generic
        
        TARGET_2ND_ARCH := arm
        TARGET_2ND_ARCH_VARIANT := armv7-a-neon
        TARGET_2ND_CPU_ABI := armeabi-v7a
        TARGET_2ND_CPU_ABI2 := armeabi
        TARGET_2ND_CPU_VARIANT := generic
        
        # Platform
        TARGET_BOARD_PLATFORM := sc9863a
        TARGET_BOOTLOADER_BOARD_NAME := sc9863a
        
        # Kernel parameters
        BOARD_KERNEL_CMDLINE := console=ttyS1,115200n8 androidboot.hardware=sc9863a printk.disable_uart=1
        BOARD_KERNEL_BASE := 0x00000000
        BOARD_KERNEL_PAGESIZE := 2048
        
        # Flash / Partitions info
        BOARD_RECOVERYIMAGE_PARTITION_SIZE := 41943040
        BOARD_FLASH_BLOCK_SIZE := 131072
        
        # TWRP Configuration Flags
        TW_THEME := portrait_hdpi
        RECOVERY_SDCARD_ON_DATA := true
        TARGET_USERIMAGES_USE_EXT4 := true
        TW_EXCLUDE_DEFAULT_USB_INIT := true
        TW_INCLUDE_CRYPTO := false
        ALLOW_MISSING_DEPENDENCIES := true
        EOF
        
        cat <<EOF > omni_${{ env.DEVICE_NAME }}.mk
        \$(call inherit-product, \$(SRC_TARGET_DIR)/product/core_64_bit.mk)
        \$(call inherit-product, \$(SRC_TARGET_DIR)/product/embedded.mk)
        
        PRODUCT_DEVICE := ${{ env.DEVICE_NAME }}
        PRODUCT_NAME := omni_${{ env.DEVICE_NAME }}
        PRODUCT_BRAND := ${{ env.DEVICE_BRAND }}
        PRODUCT_MODEL := ${{ env.DEVICE_NAME }}
        PRODUCT_MANUFACTURER := ${{ env.DEVICE_BRAND }}
        EOF
        
        cat <<EOF > Android.mk
        LOCAL_PATH := \$(call my-dir)
        ifeq (\$(TARGET_DEVICE),${{ env.DEVICE_NAME }})
        include \$(call all-makefiles-under,\$(LOCAL_PATH))
        endif
        EOF

    - name: Install Android Build Tools and Fix Old Libraries
      run: |
        export DEBIAN_FRONTEND=noninteractive
        # Подключаем архивный репозиторий Ubuntu 20.04 ради старых 32-битных библиотек компилятора
        echo "deb http://ubuntu.com focal-security main" | sudo tee /etc/apt/sources.list.d/focal-security.list
        sudo apt-get update
        sudo apt-get install -y libncurses5 libssl1.1 || true
        sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush schedtool squashfs-tools xsltproc zlib1g-dev

    - name: Prepare Official TWRP Source Environment via Repo
      run: |
        mkdir -p twrp_sources
        cd twrp_sources
        
        # Чистим системный конфиг от ломающих подмен
        echo -e "[user]\n\tname = nubikfifa-source\n\temail = nubikfifa-source@github.com" > ~/.gitconfig
        
        # Официальная и чистая инициализация репозитория
        repo init --depth=1 -u https://github.com -b twrp-9.0 --no-clone-bundle
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Copy Generated Device Tree to Build Folder
      run: |
        cp -r device_tree/${{ env.DEVICE_BRAND }}/${{ env.DEVICE_NAME }} twrp_sources/device/${{ env.DEVICE_BRAND }}/${{ env.DEVICE_NAME }}

    - name: Compile TWRP Recovery Image
      run: |
        cd twrp_sources
        export ALLOW_MISSING_DEPENDENCIES=true
        /bin/bash -c "source build/envsetup.sh && lunch omni_${{ env.DEVICE_NAME }}-eng && make recoveryimage -j$(nproc --all)"

    - name: Upload Compiled TWRP Recovery as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_Recovery_${{ env.DEVICE_NAME }}
        path: twrp_sources/out/target/product/${{ env.DEVICE_NAME }}/recovery.img
