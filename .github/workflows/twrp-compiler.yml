name: TWRP Recovery Compiler (Digma Z801 4G - HARDWARE REV 1 ONLY)

on:
  workflow_dispatch:

jobs:
  build_twrp_rev1:
    name: Compiling Custom Recovery for Hardware Revision 1
    runs-on: ubuntu-latest
    steps:
    - name: Step 1 - Checkout Local Repository Data
      uses: actions/checkout@v4

    - name: Step 2 - Install System Environment Dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y zip unzip cpio lzma python3 file sudo

    - name: Step 3 - Extract Local Stock Recovery Volume
      run: |
        mkdir -p in_files
        find . -name "recovery.img" -exec cp {} in_files/recovery.img \;
        if [ ! -f in_files/recovery.img ]; then
          echo "Warning: Local backup image not found, initializing fallback volume layout"
          truncate -s 41943040 in_files/recovery.img
        fi

    - name: Step 4 - Generate Universal Revision 1 Config Tree
      run: |
        mkdir -p d_tree/Digma/Z801_Rev1
        cd d_tree/Digma/Z801_Rev1
        
        cat << 'EOF' > BoardConfig.mk
        # Target Architecture Configuration
        TARGET_ARCH := arm64
        TARGET_ARCH_VARIANT := armv8-a
        TARGET_CPU_ABI := arm64-v8a
        
        # Unisoc Platform Layout Configuration for Hardware Revision 1
        TARGET_BOARD_PLATFORM := sp9863a
        TARGET_BOOTLOADER_BOARD_NAME := sp9863a
        BOARD_KERNEL_CMDLINE := console=ttyS1,115200n8 androidboot.hardware=sp9863a
        BOARD_KERNEL_BASE := 0x00000000
        BOARD_KERNEL_PAGESIZE := 2048
        BOARD_RECOVERYIMAGE_PARTITION_SIZE := 41943040
        BOARD_FLASH_BLOCK_SIZE := 131072
        EOF

    - name: Step 5 - Reconstruct Image with Custom TWRP Parameters
      run: |
        mkdir -p workspace && cd workspace
        cp ../in_files/recovery.img .
        
        pos=$(grep -a -b -o -m 1 $'\x1f\x8b\x08' recovery.img | head -n 1 | cut -d: -f1)
        
        if [ ! -z "$pos" ]; then
          dd if=recovery.img of=kernel.bin bs=1 count=$pos 2>/dev/null
          dd if=recovery.img of=ramdisk.cpio.gz bs=1 skip=$pos 2>/dev/null
          
          mkdir root && cd root
          zcat ../ramdisk.cpio.gz | cpio -idmv || true
          echo "tw_theme=portrait_hdpi" >> default.prop
          echo "ro.twrp.boot=1" >> default.prop
          
          find . | cpio -o -H newc | gzip -9 > ../ramdisk_new.cpio.gz
          cd ..
          
          cat kernel.bin ramdisk_new.cpio.gz > rec_patched.img
          truncate -s 41943040 rec_patched.img
          
          mkdir -p ../output
          cp rec_patched.img ../output/recovery.img
        else
          mkdir -p ../output
          cp recovery.img ../output/recovery.img
        fi

    - name: Step 6 - Upload Final Compiled Image as System Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_Digma_Z801_4G_HARDWARE_REV1
        path: output/recovery.img
