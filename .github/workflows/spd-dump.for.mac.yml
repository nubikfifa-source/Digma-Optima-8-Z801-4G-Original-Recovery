name: Build spd_dump for Intel macOS

on:
  workflow_dispatch:

jobs:
  build_macos_tool:
    name: Compile Portable spd_dump for Intel macOS (x86_64)
    runs-on: macos-latest
    steps:
      - name: 1. Build Static Intel libusb from Source
        run: |
          mkdir -p work && cd work
          LIBUSB_URL=$(printf "https://%s/%s/%s/releases/download/v1.0.27/libusb-1.0.27.tar.bz2" "github.com" "libusb" "libusb")
          curl -sL "$LIBUSB_URL" -o libusb.tar.bz2
          tar -xjf libusb.tar.bz2
          cd libusb-1.0.27
          
          # Собираем статическую библиотеку под Intel (x86_64) с поддержкой старых macOS
          CFLAGS="-arch x86_64 -mmacosx-version-min=10.15 -O2" \
          LDFLAGS="-arch x86_64 -mmacosx-version-min=10.15" \
          ./configure --host=x86_64-apple-darwin --prefix="$(pwd)/../libusb_intel" --enable-static --disable-shared
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: 2. Clone and Compile Standalone spd_dump (x86_64)
        run: |
          cd work
          REPO_URL=$(printf "https://%s/%s/%s.git" "github.com" "TomKing062" "spd_dump")
          git clone "$REPO_URL" spd_dump
          cd spd_dump
          
          INC_DIR="$(pwd)/../libusb_intel/include/libusb-1.0"
          LIB_FILE="$(pwd)/../libusb_intel/lib/libusb-1.0.a"
          
          # Компилируем единый автономный файл под Intel x86_64 с системными фреймворками USB
          clang -arch x86_64 -mmacosx-version-min=10.15 -O2 -I"$INC_DIR" *.c "$LIB_FILE" -framework IOKit -framework CoreFoundation -framework Security -o spd_dump
          
          file spd_dump
          otool -L spd_dump

      - name: 3. Upload Ready Binary
        uses: actions/upload-artifact@v4
        with:
          name: spd_dump_macOS_Intel_x86_64
          path: work/spd_dump/spd_dump
